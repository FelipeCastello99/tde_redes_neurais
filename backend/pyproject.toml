[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "tde-redes-neurais"
version = "0.1.0"
description = "TDE de Redes Neurais: MLP do zero em NumPy aplicada a acidentes em rodovias federais (PRF/DATATRAN)"
readme = { text = "Backend do TDE: núcleo NumPy (nn) e API FastAPI para treino, histórico e simulador.", content-type = "text/markdown" }
requires-python = ">=3.12"
authors = [
    { name = "Felipe Medeiros Castello Branco" },
    { name = "Herbeth Lucas de Sousa Pereira" },
    { name = "Samuel Pereira da Silva Varão" },
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "sse-starlette>=2.1",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
    "nbclient>=0.10",
    "nbconvert>=7.16",
    "nbformat>=5.10",
    "ipykernel>=6.29",
    "python-docx>=1.1",
    "python-pptx>=1.0",
    "reportlab>=4.2",
    "pillow>=10.4",
    "qrcode[pil]>=8.0",
    "mammoth>=1.8",
    "weasyprint>=62",
    "beautifulsoup4>=4.12",
]

[tool.setuptools.packages.find]
include = ["nn*", "api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error::DeprecationWarning:nn.*"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "RUF001"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
ignore_missing_imports = true
