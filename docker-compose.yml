services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tde}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tde}
      POSTGRES_DB: ${POSTGRES_DB:-tde}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tde} -d ${POSTGRES_DB:-tde}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  data:
    image: python:3.12-slim
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    volumes:
      - ./backend:/app
    command: ["python", "/app/scripts/fetch_data.py"]
    restart: "no"

  api:
    build:
      context: ./backend
      dockerfile: api/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-tde}:${POSTGRES_PASSWORD:-tde}@db:5432/${POSTGRES_DB:-tde}
      DATA_DIR: /app/data/raw
      ARTIFACTS_DIR: /app/artifacts
      MAX_CONCURRENT_RUNS: 1
    volumes:
      - ./backend/data:/app/data
      - ./backend/artifacts:/app/artifacts
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      data:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:8000}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  pgdata:
